# One-time cleanup: delete the version tags that point at the pre-rewrite history.
# Runs once, when this file lands on main. A follow-up PR removes the file.
name: Delete old tags

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-old-tags.yml

permissions:
  contents: write

jobs:
  delete-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete tags
        run: |
          set -u
          tags="v0.6.0-blog-fix v0.6.0-pre-birth v0.6.0-pre-launch v0.6.0-test-coverage \
                v0.8.0 v0.8.2-rc4 v0.8.4 v0.8.5 v0.8.6 v0.8.7 v0.8.8"
          for t in $tags; do
            if git ls-remote --exit-code --tags origin "refs/tags/$t" >/dev/null 2>&1; then
              git push origin ":refs/tags/$t" && echo "deleted $t"
            else
              echo "already gone: $t"
            fi
          done
          echo "Remaining tags:"
          git ls-remote --tags origin | awk -F/ '{print $3}' | grep -v '\^{}' || echo "(none)"
